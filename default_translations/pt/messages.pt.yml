  title: Conta bloqueada
  text: >
    Ah não! Acreditamos que a sua conta tenha sido usada por um spammer.
    Nós bloqueamos o acesso ao e-mail por essa razão.
    Por favor entre em contato com o suporte para desbloquear a sua conta.
Bad credentials.: Detalhes de login errados
custom: personalizado
random: aleatório
mail:
  welcome-subject: Te damos as boas-vindas a %project_name%
  welcome-body: >
    Caro usuário,

    Boas-vindas. Você pode encontrar guias sobre como configurar sua conta
    em diferentes programas de e-mail pela internet.

    Você tem uma cota de 1GB na sua caixa de entrada. O seu email talvez não
    funcione corretamente se você ultrapassar essa cota.

    Daqui uma semana, você receberá três convites, os quais você pode pegar
    em %voucher_url%. Você pode dá-los aos seus contatos e convidá-los
    a se cadastrar no %project_name%.

    Sinceramente, time %project_name%.
  recovery-subject: Recuperação de senha iniciada para %email%
  recovery-body: |
    Olá %email%,

    Alguém iniciou a recuperação de senha da sua conta em
    %recovery_url%
    usando o seu endereço de e-mail e o seu token de recuperação.

    Se foi você:
    Após o período de espera de %hours% horas, a partir de %time%,
    você poderá criar uma nova senha aqui:
    %recovery_url%
    Insira novamente o seu endereço de e-mail e o seu token de recuperação.

    Se não foi você:
    Outra pessoa conhece o seu token de recuperação e está tentando tomar
    posse da sua conta. Cancele a recuperação antes de %time%:
    %cancel_url%
    Depois, entre e crie um novo token de recuperação, para que o token
    antigo deixe de funcionar:
    %recovery_token_url%

    Time %project_name%.
  alias-created-subject: Novo endereço alias criado
  alias-created-body: >
    Olá %email%,

    Um novo endereço alias foi criado para o seu email %email%:
    %alias%

    Gerencie os seus endereços alias aqui: %alias_url%

    Esperamos que continue a tirar proveito da sua conta.
    Time %project_name%.
