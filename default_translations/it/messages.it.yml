recovery:
  information-extra: Questo disattiva l'autenticazione a due fattori ed elimina tutte le password per le app.
  intro: "Il recupero richiede due visite: inserisci il tuo indirizzo e-mail e il tuo gettone di recupero ora, e di nuovo dopo %hours% ore per impostare una nuova password."
  started: Recupero avviato. Per la tua sicurezza, devi attendere %hours% ore.
  pending: Il recupero è già in corso.
  time-left: "Tempo rimanente: %hours% h %minutes% min."
  waiting-time: Potrai impostare una nuova password a partire dal %time%.
  come-back: Torna quindi su %url% e inserisci di nuovo il tuo indirizzo e-mail e il tuo gettone di recupero.
  steps:
    label: Avanzamento del recupero
    start: Avvia
    wait: Attendi
    password: Nuova password
    token: Salva gettone
    done: completato
  cancel: Annulla
copy-to-clipboard: Copia negli appunti
recovery-token:
  created-info: Se dimentichi la password, puoi impostarne una nuova con questo gettone.
  displayed-once: Questo gettone viene mostrato una sola volta.
  download: Scarica come file di testo
  store-hint: Conservalo in un gestore di password o stampalo. Senza la tua password e questo gettone, le tue e-mail cifrate sono perse.
  file-content: |
    Gettone di recupero di %project_name%

    Indirizzo e-mail: %email%
    Gettone di recupero: %token%

    Se dimentichi la password, puoi impostarne una nuova con questo gettone di
    recupero. Conserva questo file in un posto sicuro: chiunque lo abbia può
    avviare il recupero della password per il tuo account.
