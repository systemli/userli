  headline: "Annulla il recupero della password"
  lead: "Il %time% è stato avviato un recupero della password per %email%."
  warning: "Annulla il recupero solo se non l'hai avviato tu. Chi l'ha avviato conosce il tuo gettone di recupero e può avviare un nuovo recupero."
  next-step: "Dopo l'annullamento, accedi e crea un nuovo gettone di recupero. Così il vecchio gettone non sarà più valido."
  button: "Annulla il recupero"
  done-headline: "Recupero annullato"
  done-text: "Il recupero della password è stato annullato."
