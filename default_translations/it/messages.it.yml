  recovery-cancelled: "Il recupero della password è stato annullato."
  recovery-cancel-failed: "Non è stato possibile annullare il recupero della password. Riprova."
  openpgp-key-upload-error-no-keys: Nessuna chiave per il tuo indirizzo e-mail trovata nei dati caricati.
  openpgp-key-upload-error-multiple-keys: >
    Nei dati caricati è stata trovata più di una chiave per il tuo indirizzo e-mail.
    Si prega di caricare solo una chiave.
  recovery-token-invalid: L'indirizzo e-mail o il gettone di recupero non è corretto. Controlla entrambi e riprova.
  recovery-reauthenticate: Non è stato possibile verificare il recupero della password. Inserisci di nuovo il tuo indirizzo e-mail e il tuo gettone di recupero.
  recovery-session-expired: Inserisci di nuovo il tuo indirizzo e-mail e il tuo gettone di recupero per impostare una nuova password.
  recovery-reset-hint: L'autenticazione a due fattori è disattivata e le tue password per le app sono state eliminate. Riattiva la 2FA e crea nuove password per le app.
spam:
  title: Account bloccato
  text: >
    Oh no, crediamo che il tuo account sia stato usato impropriamente da uno spammer.
    L'accesso alla posta elettronica è stato disattivato.
    Contatta il supporto per sbloccare il tuo account.
mail:
  welcome-subject: Benvenuto/a su %project_name%
  alias-created-subject: Nuovo indirizzo alias creato
  alias-created-body: >
    Ciao %email%,

    Per il tuo indirizzo e-mail %email% è stato aggiunto un nuovo alias:
    %alias%

    Gestisci i tuoi alias di posta elettronica qui: %alias_url%

    Ci auguriamo che tu continui a goderti il tuo account di posta elettronica.
    La tua squadra gestione %project_name%.
  welcome-body: >
    Caro utente,

    Benvenuto a bordo. Puoi trovare guide per impostare il tuo account di posta elettronica
    con diversi programmi client su Internet.

    Avrai una casella di posta elettronica con una quota di 1 GB. Se superi il tuo limite,
    il tuo account di posta elettronica potrebbe non funzionare correttamente.

    In una settimana riceverai tre codici invito, che potrai ritirare
    su %voucher_url%. Puoi passarli ai tuoi amici e
    invitarli a registrarsi con %project_name%.

    Sinceramente,
    il tuo team di amministrazione di %project_name%.
  recovery-subject: Recupero della password avviato per %email%
  recovery-body: |
    Ciao %email%,

    Qualcuno ha avviato il recupero della password per il tuo account su
    %recovery_url%
    usando il tuo indirizzo e-mail e il tuo gettone di recupero.

    Se sei stato/a tu:
    Dopo il periodo di attesa di %hours% ore, a partire dal %time%,
    puoi impostare una nuova password qui:
    %recovery_url%
    Inserisci di nuovo il tuo indirizzo e-mail e il tuo gettone di recupero.

    Se non sei stato/a tu:
    Qualcun altro conosce il tuo gettone di recupero e sta cercando di
    impossessarsi del tuo account. Annulla il recupero prima del %time%:
    %cancel_url%
    Poi accedi e crea un nuovo gettone di recupero, così il vecchio gettone
    non funzionerà più:
    %recovery_token_url%

    Il team di amministrazione di %project_name%.
