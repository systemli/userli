framework:
  messenger:
    transports:
      async:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        retry_strategy:
          max_retries: 3
          delay: 10000
          multiplier: 6

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                sync: 'sync://'
            # Handle these right away in tests, so Behat can check the sent mails.
            # Routing configuration takes precedence over #[AsMessage].
            routing:
                App\Message\RecoveryProcessMail: sync
                App\Message\RecoveryTokenCreatedMail: sync
