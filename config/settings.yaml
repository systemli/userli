settings:
  app_name:
    type: string
    default: "Userli"
    validation:
      min_length: 3
      max_length: 30

  app_url:
    type: url
    default: "https://users.example.org"

  project_name:
    type: string
    default: "example.org"

  project_url:
    type: url
    default: "https://www.example.org"

  email_sender_address:
    type: email
    default: "admin@example.org"

  email_notification_address:
    type: email
    default: "monitoring@example.org"

  support_address:
    type: email
    default: ""
    optional: true

  webmail_url:
    type: url
    default: ""
    optional: true

  weekly_report_enabled:
    type: boolean
    default: true

  # A migration turns it off for existing installations
  twofactor_app_passwords_required:
    type: boolean
    default: true

  # Empty means the host of app_url. A domain without scheme or port, e.g. example.org
  webauthn_rp_id:
    type: string
    default: ""
    optional: true
    validation:
      regex: '/^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$/i'
      regex_message: settings.webauthn-rp-id-invalid

  # Origins besides app_url that may use WebAuthn credentials, e.g. Keycloak. One per line, e.g. https://login.example.org
  webauthn_origins:
    type: textarea
    default: ""
    optional: true
    validation:
      regex: '/^\h*(?:https?:\/\/[a-z0-9.-]+(?::\d+)?\/?)?\h*(?:\R\h*(?:https?:\/\/[a-z0-9.-]+(?::\d+)?\/?)?\h*)*$/i'
      regex_message: settings.webauthn-origins-invalid

  smtp_quota_limit_per_hour:
    type: integer
    default: 0
    validation:
      min: 0

  smtp_quota_limit_per_day:
    type: integer
    default: 0
    validation:
      min: 0

  mail_crypt:
    type: integer
    default: 2
    validation:
      choices: [0, 1, 2, 3]

  mta_sts_mode:
    type: string
    default: "testing"
    validation:
      choices: ["none", "testing", "enforce"]

  mta_sts_mx:
    type: textarea
    default: ""
    optional: true

  mta_sts_max_age:
    type: integer
    default: 604800
    validation:
      min: 86400
      max: 31557600

  postmaster_address:
    type: email
    default: ""
    optional: true

  abuse_address:
    type: email
    default: ""
    optional: true
