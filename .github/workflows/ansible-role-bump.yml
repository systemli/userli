name: Bump Ansible Role

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Userli version to bump the Ansible role to (e.g. 6.12.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: Open PR in systemli/ansible-role-userli
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

      - name: Obtain Access Token
        id: access_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.SYSTEMLI_APP_ID }}
          private-key: ${{ secrets.SYSTEMLI_APP_PRIVATE_KEY }}
          owner: systemli
          repositories: ansible-role-userli
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Ansible role
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: systemli/ansible-role-userli
          token: ${{ steps.access_token.outputs.token }}
          path: ansible-role-userli

      - name: Update version
        working-directory: ansible-role-userli
        run: |
          sed -i "s/^userli_version: \".*\"$/userli_version: \"$VERSION\"/" defaults/main.yml
          git diff

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: ansible-role-userli
          token: ${{ steps.access_token.outputs.token }}
          commit-message: "Bump Userli to ${{ env.VERSION }}"
          branch: automated/bump-userli-${{ env.VERSION }}
          title: "Bump Userli to ${{ env.VERSION }}"
          body: |
            Bump Userli to [${{ env.VERSION }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.VERSION }}).
          draft: false
