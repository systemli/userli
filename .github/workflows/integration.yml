name: Integration

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    name: PHPUnit & Behat
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: openssl, sodium
          coverage: pcov
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # PHP and Node toolchains are independent - install concurrently.
      # `parallel:` is not a real step property (GitHub's validator rejects it); the
      # actual primitives from the 2026-06-25 changelog are `background`/`wait-all`.
      - name: Install dependencies
        run: composer install --no-scripts
        background: true

      - name: Prepare Assets
        run: |
          yarn install --frozen-lockfile
          yarn encore dev
        background: true

      - name: Wait for installs
        wait-all: true

      # Each of these only depends on its own toolchain's install above, not on each other.
      - name: Check Code Style
        run: composer cs-check
        background: true

      - name: Prepare Database Schema
        run: bin/console doctrine:schema:create --env=test
        background: true

      - name: TypeScript Typecheck
        run: yarn typecheck
        background: true

      - name: Vitest
        run: yarn test:coverage
        background: true

      - name: Wait for checks
        wait-all: true

      - name: PHPUnit
        run: |
          bin/phpunit --coverage-clover build/clover-phpunit.xml --log-junit build/result-phpunit.xml

      - name: Behat
        run: |
          bin/console cache:clear --env=test
          bin/behat --format progress
        env:
          PANTHER_CHROME_ARGUMENTS: '--disable-gpu --headless --no-sandbox --disable-dev-shm-usage'
          PANTHER_NO_SANDBOX: 1

      - name: SonarCloud Scan
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    runs-on: ubuntu-24.04
    name: Build & Push Docker Image
    if: github.actor != 'dependabot[bot]'
    needs: test
    concurrency:
      group: docker-build-push-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

      - name: Build & Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: ${{ github.ref == 'refs/heads/main' }}
          file: docker/userli/Dockerfile
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: systemli/userli:latest
          cache-from: |
            ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=systemli/userli:buildcache' || '' }}
            type=gha
          cache-to: |
            ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=systemli/userli:buildcache' || '' }}
            type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  automerge:
    name: Merge Automatically
    needs: [test, docker]
    runs-on: ubuntu-24.04
    if: ${{ github.actor == 'dependabot[bot]' }}

    steps:
      - name: Obtain Access Token
        id: acces_token
        run: |
          TOKEN="$(npx obtain-github-app-installation-access-token ci ${{ secrets.SYSTEMLI_APP_CREDENTIALS_TOKEN }})"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Merge
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          github-token: ${{ steps.acces_token.outputs.token }}
