---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "⬆️ "
      include: "scope"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "⬆️ "
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker/release"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "⬆️ "
      include: "scope"
    groups:
      release-images:
        patterns:
          - "*"
    ignore:
      # stay on Node 22 LTS
      - dependency-name: "library/node"
        update-types: ["version-update:semver-major"]
      # stay on PHP 8.4
      - dependency-name: "library/php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
